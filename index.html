<title>Luyện Hán ngữ</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1d2433;--muted:#6b7385;--pri:#c0392b;--pri-soft:#fdecea;--ok:#2b8a3e;--okbg:#ebfbee;--bad:#c92a2a;--badbg:#fff5f5;--line:#e6e1da;--gold:#e8a317}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior-y:contain}
html:lang(zh-Hans) body{font-family:system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
html:lang(zh-Hant) body{font-family:system-ui,"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",sans-serif}
.zh,[lang="zh-Hans"]{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:calc(20px + env(safe-area-inset-left,0px));padding-right:calc(20px + env(safe-area-inset-right,0px));background:var(--pri);color:#fff}
.brand{font-weight:700;font-size:1.15rem;flex:1;letter-spacing:.3px}
.brand::before{content:"汉";display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;border-radius:8px;background:#fff;color:var(--pri);font-weight:800;vertical-align:middle}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;align-items:center;gap:8px;font-size:.9rem}
.lang select{font:inherit;padding:8px 10px;border-radius:8px;border:0;min-height:44px;font-size:16px}
main{max-width:780px;margin:20px auto;padding:0 calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px))}
.card{background:var(--card);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(60,40,20,.07)}
.center{text-align:center}
h1{margin:.1em 0 .2em;font-size:1.6rem}h2{font-size:1.05rem;margin:1.2em 0 .5em}
.muted{color:var(--muted)}.hint{color:var(--muted);font-size:.85rem;margin-top:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default;opacity:.75}
.lvl.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:600}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lvl{text-align:left;display:flex;flex-direction:column;gap:2px}.lvl span{font-size:.83rem;color:var(--muted)}
.lvl .best-mini{font-size:.78rem;color:var(--gold);font-weight:600}
.primary{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.big{width:100%;padding:13px;font-size:1.1rem;margin-top:10px}
.ghost{background:transparent}
.best{margin-top:18px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:.92rem}.spacer{flex:1}
.tag{padding:2px 10px;border-radius:99px;background:#efebe5;font-size:.85rem}
.tag.type{background:var(--pri-soft);color:var(--pri)}
.progress{height:6px;background:#efebe5;border-radius:99px;margin:14px 0 6px;overflow:hidden}.progress div{height:100%;background:var(--pri);transition:width .3s}
.stem{font-size:1.1rem;font-weight:500;margin:6px 0 10px}
.zhbox{background:#fbfaf7;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.zh-word{font-size:2.4rem;text-align:center;letter-spacing:2px;margin:4px 0}
.zh-py{font-size:1.9rem;text-align:center;margin:4px 0;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.zh-sent{font-size:1.4rem;line-height:1.9;margin:4px 0}
.zh-passage{font-size:1.12rem;line-height:1.95;margin:0 0 10px;text-indent:2em}
.zh-ask{font-size:1.15rem;font-weight:600;margin:6px 0 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--pri);margin:0 4px;text-align:center}
.fill{color:var(--ok);font-weight:700;border-bottom-color:var(--ok)}
.speak-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.spk{display:inline-flex;align-items:center;gap:6px;border-color:var(--pri);color:var(--pri);background:#fff;font-weight:600}
.spk.big-spk{font-size:1.25rem;padding:14px 26px;border-radius:99px}
.spk:disabled{border-color:var(--line);color:var(--muted)}
.listen-hint{text-align:center;color:var(--muted);margin:8px 0 0;font-size:.9rem}
.transcript{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.transcript .lbl{font-size:.8rem;color:var(--muted);display:block}
.tts-warn{background:#fff9db;color:#8a6100;border-radius:10px;padding:8px 12px;font-size:.85rem;margin:0 0 12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.long{grid-template-columns:1fr}
@media (max-width:560px){.choices{grid-template-columns:1fr}.zh-word{font-size:2rem}}
.choice{text-align:left;padding:14px 14px;font-size:1.08rem;display:flex;gap:10px;align-items:center;min-height:48px}
.choice .key{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#efebe5;font-size:.8rem;color:var(--muted)}
.choice.zhc{font-size:1.2rem}
.choice.pyc{font-size:1.25rem;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.choice.sel{border-color:var(--pri);background:var(--pri-soft)}
.choice.right{border-color:var(--ok);background:var(--okbg)}.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.warn{color:var(--bad);min-height:1em;margin:8px 0}
.feedback{border-radius:12px;padding:12px 14px;margin:6px 0}
.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}
.expl{color:var(--ink);margin-top:6px}
.feedback .spk{margin-top:10px;font-size:.9rem;padding:6px 12px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.actions.centered{justify-content:center}
.ring{--p:0;width:140px;height:140px;margin:16px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),#efebe5 0)}
.ring span{width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.big-text{font-size:1.2rem;font-weight:600}
.badge{display:inline-block;background:#fff9db;color:#e67700;padding:4px 12px;border-radius:99px;font-weight:600}
.types{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.types span{background:#f3efe9;border-radius:99px;padding:3px 10px;font-size:.85rem}
.review{padding-left:20px}.review li{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.review li.ok .res{color:var(--ok)}.review li.bad .res{color:var(--bad)}
.review p{margin:.2em 0}.stem-sm{font-weight:500}.review .expl{color:var(--muted);font-size:.92rem}
.review .tag{font-size:.75rem;margin-right:4px}
.ftr{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.resume{border:2px solid var(--pri)}

/* iOS / PWA mobile UX */
html{-webkit-text-size-adjust:100%}
.spk{min-height:44px;padding:10px 16px}
.spk.big-spk{min-height:52px}
.actions button{flex:1 1 auto;min-width:120px}
.lvl{min-height:56px;padding:12px 14px}
@media (max-width:560px){
  .hdr{gap:8px;padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
  .brand{font-size:1.05rem}
  .lang span{display:none}
  .card{padding:16px;border-radius:14px}
  .actions{flex-wrap:wrap}
}
@supports (padding: max(0px)) {
  body{padding-bottom:max(0px, env(safe-area-inset-bottom))}
}

/* ---- 4-skill version ---- */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.skill{text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px;padding:12px 14px}
.skill .ico{font-size:1.5rem;line-height:1}
.skill b{font-size:1.05rem}.skill span{font-size:.8rem;color:var(--muted)}
.skill.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.skill .best-mini{font-size:.78rem;color:var(--gold);font-weight:600}
.tag.sk{background:#e7f0ff;color:#1c4fb8}
.gloss{text-align:center;color:var(--muted);font-size:1.05rem;margin:2px 0 6px}
.num-big{font-size:2.6rem;text-align:center;font-weight:700;margin:6px 0;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.hl{color:var(--pri);font-weight:800;text-decoration:underline;text-underline-offset:4px}
.chunks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:1.3rem}
.chip-end{font-size:1.3rem;color:var(--muted);align-self:center}
.pyhint{text-align:center;color:#4a5568;font-size:1.05rem;margin:4px 0;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.linkbtn{background:none;border:0;color:var(--pri);text-decoration:underline;padding:4px 6px;min-height:32px;font-size:.9rem}
.mic-row{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 10px}
.mic{font-size:1.25rem;padding:14px 30px;border-radius:99px;background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700;min-height:56px}
.mic.on{animation:pulse 1s infinite;background:#e03131}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,49,49,.5)}100%{box-shadow:0 0 0 16px rgba(224,49,49,0)}}
.said{border-radius:10px;padding:8px 12px;background:#f1f3f5;font-size:1.05rem;text-align:center}
.said.ok{background:var(--okbg);color:var(--ok)}.said.bad{background:var(--badbg);color:var(--bad)}
.speak-opts{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px}
.speak-opts li{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:1.15rem;background:#fff}
.speak-opts li.right{border:1px solid var(--ok);background:var(--okbg)}
.speak-opts li.mine{border:1px solid var(--pri)}
.modesw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;margin:8px 0 0}
.modesw button{min-height:34px;padding:4px 10px;font-size:.85rem}
.modesw button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:600}
.sr-note{background:#e7f5ff;color:#1864ab;border-radius:10px;padding:8px 12px;font-size:.85rem;margin:0 0 12px}
.dl-line{font-size:1.25rem;line-height:1.8;margin:2px 0}

</style>
</head>

var RULES = {"1.shi":{"vi":"「是」 nối hai danh từ: A 是 B = A là B. Phủ định dùng 「不是」.","en":"「是」 links two nouns: A 是 B = A is B. Negative: 不是.","zh-Hans":"「是」连接两个名词：A是B。否定形式是「不是」。","zh-Hant":"「是」連接兩個名詞：A是B。否定形式是「不是」。"},"1.you":{"vi":"「有」 nghĩa là 'có' (sở hữu / tồn tại). Phủ định là 「没有」, không nói 「不有」.","en":"「有」 means 'to have / there is'. Its negative is 没有, never 不有.","zh-Hans":"「有」表示领有或存在，否定用「没有」，不说「不有」。","zh-Hant":"「有」表示領有或存在，否定用「沒有」，不說「不有」。"},"1.meiyou":{"vi":"Phủ định của 「有」 luôn là 「没有」: 我没有妹妹. 「不」 không đi với 「有」.","en":"The negative of 有 is always 没有 (我没有妹妹). 不 cannot negate 有.","zh-Hans":"「有」的否定只能用「没」：没有妹妹，不能说「不有」。","zh-Hant":"「有」的否定只能用「沒」：沒有妹妹，不能說「不有」。"},"1.ma":{"vi":"Thêm 「吗」 vào cuối câu trần thuật để tạo câu hỏi có/không.","en":"Adding 吗 to the end of a statement turns it into a yes/no question.","zh-Hans":"陈述句末尾加「吗」，构成是非问句。","zh-Hant":"陳述句末尾加「嗎」，構成是非問句。"},"1.ne":{"vi":"「…呢？」 dùng để hỏi lại cùng một vấn đề: 我很好，你呢？ = Còn bạn thì sao?","en":"「…呢？」 asks 'and you / what about…?' on the same topic: 我很好，你呢？","zh-Hans":"「名词/代词＋呢？」承接上文追问同样的问题，如「我很好，你呢？」。","zh-Hant":"「名詞/代詞＋呢？」承接上文追問同樣的問題，如「我很好，你呢？」。"},"1.adj":{"vi":"Tính từ làm vị ngữ không cần 「是」; thường thêm 「很」 trước tính từ: 我很忙.","en":"Adjectives act as predicates without 是; 很 is usually added before them: 我很忙.","zh-Hans":"形容词直接作谓语，不用「是」，前面常加「很」：我很忙。","zh-Hant":"形容詞直接作謂語，不用「是」，前面常加「很」：我很忙。"},"1.mw_ben":{"vi":"「本」 là lượng từ cho sách, vở: 三本书.","en":"本 is the measure word for books and notebooks: 三本书.","zh-Hans":"「本」是书、本子的量词：三本书。","zh-Hant":"「本」是書、本子的量詞：三本書。"},"1.mw_kou":{"vi":"Nói số người trong gia đình dùng lượng từ 「口」: 我家有五口人.","en":"口 is used to count the members of a household: 我家有五口人.","zh-Hans":"说家庭人数用量词「口」：我家有五口人。","zh-Hant":"說家庭人數用量詞「口」：我家有五口人。"},"1.mw_bei":{"vi":"「杯」 = cốc/ly, lượng từ cho đồ uống: 一杯咖啡.","en":"杯 (cup/glass) measures drinks: 一杯咖啡.","zh-Hans":"「杯」用于饮料：一杯咖啡、一杯茶。","zh-Hant":"「杯」用於飲料：一杯咖啡、一杯茶。"},"1.mw_ge":{"vi":"「个」 là lượng từ phổ biến nhất, dùng cho người và nhiều sự vật: 二十个学生.","en":"个 is the most general measure word, used for people and many things: 二十个学生.","zh-Hans":"「个」是最常用的量词，可用于人和许多事物：二十个学生。","zh-Hant":"「個」是最常用的量詞，可用於人和許多事物：二十個學生。"},"1.qw":{"vi":"Câu hỏi có đại từ nghi vấn giữ nguyên trật tự câu; đặt từ để hỏi vào vị trí thông tin cần hỏi: 什么 = gì (sự vật), 谁 = ai, 哪儿 = đâu.","en":"Question words stay in the position of the information asked about, with normal word order: 什么 what, 谁 who, 哪儿 where.","zh-Hans":"特指问句语序不变，疑问代词放在所问成分的位置：什么（事物）、谁（人）、哪儿（地点）。","zh-Hant":"特指問句語序不變，疑問代詞放在所問成分的位置：什麼（事物）、誰（人）、哪兒（地點）。"},"1.ji":{"vi":"「几」 hỏi số lượng nhỏ (thường dưới 10) và phải đi kèm lượng từ: 几口人.","en":"几 asks about small numbers (usually under 10) and must be followed by a measure word: 几口人.","zh-Hans":"「几」询问较小的数目（一般十以下），后面要带量词：几口人。","zh-Hant":"「幾」詢問較小的數目（一般十以下），後面要帶量詞：幾口人。"},"1.duoshao":{"vi":"「多少」 hỏi số lượng bất kỳ (thường lớn) và có thể bỏ lượng từ; 「几」 bắt buộc có lượng từ nên 「几学生」 sai.","en":"多少 asks about any (often large) quantity and may omit the measure word; 几 needs a measure word, so 几学生 is wrong.","zh-Hans":"「多少」可问任何数目（多用于较大的数），后面可以不用量词；「几」必须带量词，「几学生」不对。","zh-Hant":"「多少」可問任何數目（多用於較大的數），後面可以不用量詞；「幾」必須帶量詞，「幾學生」不對。"},"1.ye":{"vi":"「也」 = cũng, đứng trước động từ: 我也是学生.","en":"也 means 'also' and goes before the verb: 我也是学生.","zh-Hans":"「也」表示同样，放在动词前：我也是学生。","zh-Hant":"「也」表示同樣，放在動詞前：我也是學生。"},"1.dou":{"vi":"「都」 = đều, tổng kết chủ ngữ số nhiều đứng trước, đặt trước động từ: 我们都是越南人.","en":"都 means 'all/both', refers back to a plural subject and goes before the verb: 我们都是越南人.","zh-Hans":"「都」总括前面的复数成分，放在动词前：我们都是越南人。","zh-Hant":"「都」總括前面的複數成分，放在動詞前：我們都是越南人。"},"1.zai":{"vi":"「在 + nơi chốn」 đứng trước động từ để chỉ nơi xảy ra hành động: 在银行工作.","en":"在 + place comes before the verb to show where an action happens: 在银行工作.","zh-Hans":"「在＋处所」放在动词前，表示动作发生的地点：在银行工作。","zh-Hant":"「在＋處所」放在動詞前，表示動作發生的地點：在銀行工作。"},"1.bu":{"vi":"「不」 phủ định hiện tại, tương lai, thói quen: 我明天不去. 「没」 phủ định việc đã xảy ra.","en":"不 negates present, future or habitual actions (我明天不去); 没 negates past events.","zh-Hans":"「不」否定现在、将来或经常性的动作（我明天不去）；「没」否定已经发生的事。","zh-Hant":"「不」否定現在、將來或經常性的動作（我明天不去）；「沒」否定已經發生的事。"},"1.de":{"vi":"「的」 biểu thị sở hữu: 我的书 = sách của tôi.","en":"的 marks possession: 我的书 = my book.","zh-Hans":"「的」表示领属关系：我的书。","zh-Hant":"「的」表示領屬關係：我的書。"},"1.liang":{"vi":"Trước lượng từ dùng 「两」 chứ không dùng 「二」: 两个弟弟. 「二」 dùng khi đếm số.","en":"Before a measure word use 两, not 二: 两个弟弟. 二 is used when counting.","zh-Hans":"量词前用「两」不用「二」：两个弟弟；数数时用「二」。","zh-Hant":"量詞前用「兩」不用「二」：兩個弟弟；數數時用「二」。"},"2.le_done":{"vi":"「了」 sau động từ biểu thị hành động đã hoàn thành: 买了一件衣服.","en":"了 after a verb marks a completed action: 买了一件衣服.","zh-Hans":"动词后的「了」表示动作完成：买了一件衣服。","zh-Hant":"動詞後的「了」表示動作完成：買了一件衣服。"},"2.le_change":{"vi":"「了」 cuối câu biểu thị sự thay đổi trạng thái / tình huống mới: 天气冷了 (trời đã trở lạnh).","en":"Sentence-final 了 shows a change of state or a new situation: 天气冷了 (it has turned cold).","zh-Hans":"句末「了」表示变化或出现新情况：天气冷了。","zh-Hant":"句末「了」表示變化或出現新情況：天氣冷了。"},"2.guo":{"vi":"「过」 sau động từ diễn tả kinh nghiệm 'đã từng': 我去过中国. Phủ định: 没 + V + 过 (không dùng 了).","en":"过 after a verb expresses past experience ('have ever'): 我去过中国. Negative: 没 + V + 过 (no 了).","zh-Hans":"动词后的「过」表示曾经有过的经历：我去过中国。否定式为「没＋动词＋过」，不能用「了」。","zh-Hant":"動詞後的「過」表示曾經有過的經歷：我去過中國。否定式爲「沒＋動詞＋過」，不能用「了」。"},"2.zhe":{"vi":"「着」 sau động từ biểu thị trạng thái đang tiếp diễn: 门开着, 穿着红衣服.","en":"着 after a verb marks a continuing state: 门开着 (the door is open), 穿着红衣服.","zh-Hans":"动词后的「着」表示状态的持续：门开着、穿着红衣服。","zh-Hant":"動詞後的「着」表示狀態的持續：門開着、穿着紅衣服。"},"2.zhengzai":{"vi":"「正在 + V (+ 呢)」 diễn tả hành động đang diễn ra: 我正在吃饭呢.","en":"正在 + verb (+ 呢) expresses an action in progress: 我正在吃饭呢.","zh-Hans":"「正在＋动词（＋呢）」表示动作正在进行：我正在吃饭呢。","zh-Hant":"「正在＋動詞（＋呢）」表示動作正在進行：我正在喫飯呢。"},"2.bi":{"vi":"So sánh hơn: A 比 B + tính từ: 今天比昨天冷.","en":"Comparison: A 比 B + adjective: 今天比昨天冷.","zh-Hans":"比较句：A比B＋形容词，如「今天比昨天冷」。","zh-Hant":"比較句：A比B＋形容詞，如「今天比昨天冷」。"},"2.bi_nohen":{"vi":"Trong câu 「比」 không dùng 很/非常/太 trước tính từ: 苹果比香蕉贵 (không nói 比香蕉很贵).","en":"In a 比 sentence, don't put 很/非常/太 before the adjective: 苹果比香蕉贵, not 比香蕉很贵.","zh-Hans":"「比」字句中形容词前不能用「很、非常、太」：苹果比香蕉贵，不说「比香蕉很贵」。","zh-Hant":"「比」字句中形容詞前不能用「很、非常、太」：蘋果比香蕉貴，不說「比香蕉很貴」。"},"2.bi_degree":{"vi":"Muốn nói hơn bao nhiêu, đặt 「一点儿 / 得多 / 多了」 sau tính từ: 哥哥比我高一点儿. 「有点儿」 không đứng ở vị trí này.","en":"To say how much more, put 一点儿/得多/多了 after the adjective: 哥哥比我高一点儿. 有点儿 can't go there.","zh-Hans":"表示差别程度，在形容词后加「一点儿、得多、多了」：哥哥比我高一点儿。「有点儿」不能放在形容词后。","zh-Hant":"表示差別程度，在形容詞後加「一點兒、得多、多了」：哥哥比我高一點兒。「有點兒」不能放在形容詞後。"},"2.bi_neg":{"vi":"Phủ định so sánh: A 没有 B + tính từ = A không bằng B: 我的房间没有你的房间大.","en":"Negative comparison: A 没有 B + adjective = A is not as … as B: 我的房间没有你的房间大.","zh-Hans":"比较的否定式：A没有B＋形容词，如「我的房间没有你的房间大」。","zh-Hant":"比較的否定式：A沒有B＋形容詞，如「我的房間沒有你的房間大」。"},"2.zui":{"vi":"「最」 = nhất, đứng trước tính từ hoặc động từ tâm lý: 最喜欢.","en":"最 means 'most' and goes before adjectives or verbs of feeling: 最喜欢.","zh-Hans":"「最」表示程度最高，放在形容词或心理动词前：最喜欢。","zh-Hant":"「最」表示程度最高，放在形容詞或心理動詞前：最喜歡。"},"2.zuo_qi":{"vi":"「骑」 dùng cho phương tiện ngồi dạng chân (xe đạp, xe máy, ngựa); 「坐」 dùng cho xe buýt, tàu điện, taxi, máy bay.","en":"骑 is for things you straddle (bicycle, motorbike, horse); 坐 is for bus, subway, taxi, plane.","zh-Hans":"「骑」用于自行车、摩托车、马等跨坐的交通工具；「坐」用于公共汽车、地铁、出租车、飞机等。","zh-Hant":"「騎」用於自行車、摩托車、馬等跨坐的交通工具；「坐」用於公共汽車、地鐵、出租車、飛機等。"},"2.mw_jian":{"vi":"「件」 là lượng từ cho áo, quần áo nói chung (và sự việc): 这件衣服.","en":"件 measures garments (tops, clothes in general) and matters: 这件衣服.","zh-Hans":"「件」用于上衣、衣服以及事情：这件衣服。","zh-Hant":"「件」用於上衣、衣服以及事情：這件衣服。"},"2.mw_tiao":{"vi":"「条」 dùng cho vật dài, hẹp: quần, váy, đường, cá: 这条裤子.","en":"条 is for long, narrow things: trousers, skirts, roads, fish: 这条裤子.","zh-Hans":"「条」用于细长的东西：裤子、裙子、路、鱼等：这条裤子。","zh-Hant":"「條」用於細長的東西：褲子、裙子、路、魚等：這條褲子。"},"2.li":{"vi":"「A 离 B + 远/近」 dùng để nói khoảng cách: 我家离学校很近.","en":"A 离 B + 远/近 expresses distance: 我家离学校很近 (my home is near the school).","zh-Hans":"「A离B＋远/近」表示距离：我家离学校很近。","zh-Hant":"「A離B＋遠/近」表示距離：我家離學校很近。"},"2.wang":{"vi":"「往 + phương hướng + động từ」 chỉ hướng di chuyển: 往左拐 = rẽ trái.","en":"往 + direction + verb shows the direction of movement: 往左拐 = turn left.","zh-Hans":"「往＋方向＋动词」表示动作的方向：往左拐。","zh-Hant":"「往＋方向＋動詞」表示動作的方向：往左拐。"},"2.hui":{"vi":"「会 + V」 diễn tả kỹ năng có được nhờ học: 我会说汉语.","en":"会 + verb expresses a learned skill: 我会说汉语 (I can speak Chinese).","zh-Hans":"「会＋动词」表示通过学习掌握的技能：我会说汉语。","zh-Hant":"「會＋動詞」表示通過學習掌握的技能：我會說漢語。"},"2.youdian":{"vi":"「有点儿 + tính từ」 = hơi…, thường mang ý không như ý: 有点儿冷. 「一点儿」 đặt sau tính từ hoặc trước danh từ.","en":"有点儿 + adjective = 'a bit (too)…', often negative: 有点儿冷. 一点儿 goes after an adjective or before a noun.","zh-Hans":"「有点儿＋形容词」表示程度不高，多含不如意：有点儿冷；「一点儿」放在形容词后或名词前。","zh-Hant":"「有點兒＋形容詞」表示程度不高，多含不如意：有點兒冷；「一點兒」放在形容詞後或名詞前。"},"2.redup":{"vi":"Lặp động từ (试试, 看看) làm câu nhẹ nhàng, nghĩa là 'thử… một chút'.","en":"Reduplicating a verb (试试, 看看) softens it: 'have a quick try / look'.","zh-Hans":"动词重叠（试试、看看）表示动作时间短或尝试，语气委婉。","zh-Hant":"動詞重疊（試試、看看）表示動作時間短或嘗試，語氣委婉。"},"2.duoshaoqian":{"vi":"Hỏi giá dùng 「多少钱」: 苹果多少钱一斤？","en":"Ask prices with 多少钱: 苹果多少钱一斤？ (How much is a jin of apples?)","zh-Hans":"问价钱用「多少钱」：苹果多少钱一斤？","zh-Hant":"問價錢用「多少錢」：蘋果多少錢一斤？"},"3.res_wan":{"vi":"Bổ ngữ kết quả 「完」 = xong: 做完, 看完, 吃完.","en":"Result complement 完 = finished: 做完, 看完, 吃完.","zh-Hans":"结果补语「完」表示动作结束：做完、看完、吃完。","zh-Hant":"結果補語「完」表示動作結束：做完、看完、喫完。"},"3.res_dao":{"vi":"Bổ ngữ kết quả 「到」 = đạt được mục đích: 找到 (tìm thấy), 收到 (nhận được).","en":"Result complement 到 = reaching the goal: 找到 (find), 收到 (receive).","zh-Hans":"结果补语「到」表示达到目的：找到、收到。","zh-Hant":"結果補語「到」表示達到目的：找到、收到。"},"3.res_dong":{"vi":"「懂」 sau 听/看 = hiểu: 听懂 (nghe hiểu), 看懂 (đọc hiểu).","en":"懂 after 听/看 = understand: 听懂 (understand by listening), 看懂.","zh-Hans":"「懂」作结果补语表示理解：听懂、看懂。","zh-Hant":"「懂」作結果補語表示理解：聽懂、看懂。"},"3.res_hao":{"vi":"「好」 làm bổ ngữ = làm xong, sẵn sàng: 准备好了.","en":"好 as a result complement = done properly / ready: 准备好了.","zh-Hans":"「好」作结果补语表示动作完成且令人满意：准备好了。","zh-Hant":"「好」作結果補語表示動作完成且令人滿意：準備好了。"},"3.res_cuo":{"vi":"「错」 làm bổ ngữ = làm sai: 写错, 听错.","en":"错 as a complement = do something wrongly: 写错, 听错.","zh-Hans":"「错」作结果补语表示动作有误：写错、听错。","zh-Hant":"「錯」作結果補語表示動作有誤：寫錯、聽錯。"},"3.ba":{"vi":"Câu chữ 「把」: S + 把 + tân ngữ + V + thành phần khác, nhấn mạnh việc xử lý đối tượng: 把门关上.","en":"把 sentence: S + 把 + object + verb + other element, stressing what is done to the object: 把门关上.","zh-Hans":"「把」字句：主语＋把＋宾语＋动词＋其他成分，强调对宾语的处置：把门关上。","zh-Hant":"「把」字句：主語＋把＋賓語＋動詞＋其他成分，強調對賓語的處置：把門關上。"},"3.ba_other":{"vi":"Trong câu 「把」 động từ không đứng một mình, phải có thành phần khác như bổ ngữ: 把作业做完了.","en":"In a 把 sentence the verb can't stand alone; it needs another element such as a complement: 把作业做完了.","zh-Hans":"「把」字句的动词不能单独出现，后面要有补语等其他成分：把作业做完了。","zh-Hant":"「把」字句的動詞不能單獨出現，後面要有補語等其他成分：把作業做完了。"},"3.ba_zai":{"vi":"「把 + O + 放在 + nơi chốn」 = đặt cái gì ở đâu: 把护照放在哪儿了？","en":"把 + O + 放在 + place = put something somewhere: 把护照放在哪儿了？","zh-Hans":"「把＋宾语＋放在＋处所」表示使事物位于某处：把护照放在哪儿了？","zh-Hant":"「把＋賓語＋放在＋處所」表示使事物位於某處：把護照放在哪兒了？"},"3.bei":{"vi":"Câu bị động 「被」: O + 被 + (người làm) + V + thành phần khác: 自行车被人借走了.","en":"被 passive: object + 被 + (agent) + verb + other element: 自行车被人借走了.","zh-Hans":"「被」字句：受事＋被＋（施事）＋动词＋其他成分：自行车被人借走了。","zh-Hant":"「被」字句：受事＋被＋（施事）＋動詞＋其他成分：自行車被人借走了。"},"3.bei_other":{"vi":"Câu 「被」 cũng cần thành phần khác sau động từ: 被弟弟吃完了 (không nói 被弟弟吃了 khi cần nhấn kết quả 'hết', càng không dùng 在吃/要吃).","en":"A 被 sentence also needs something after the verb: 被弟弟吃完了; 在吃/要吃 don't fit a completed passive.","zh-Hans":"「被」字句动词后也要有其他成分：被弟弟吃完了；「在吃、要吃」不能用于表示完成的被动句。","zh-Hant":"「被」字句動詞後也要有其他成分：被弟弟喫完了；「在喫、要喫」不能用於表示完成的被動句。"},"3.dir_lai":{"vi":"Bổ ngữ xu hướng: 「来」 khi hướng về phía người nói, 「去」 khi rời xa. Người nói ở trong nhà mời vào → 进来.","en":"Directional complements: 来 = toward the speaker, 去 = away. The speaker is inside inviting someone in → 进来.","zh-Hans":"趋向补语：向说话人方向用「来」，离开说话人用「去」。说话人在里边请人进来 → 进来。","zh-Hant":"趨向補語：向說話人方向用「來」，離開說話人用「去」。說話人在裏邊請人進來 → 進來。"},"3.dir_chulai":{"vi":"「V + 出来」 = từ trong ra ngoài: 从书包里拿出来.","en":"V + 出来 = out from inside: 从书包里拿出来.","zh-Hans":"「动词＋出来」表示由里向外：从书包里拿出来。","zh-Hant":"「動詞＋出來」表示由裏向外：從書包裏拿出來。"},"3.pot":{"vi":"Bổ ngữ khả năng: V + 得 + kết quả (làm được) / V + 不 + kết quả (không làm được): 听不懂, 吃得完.","en":"Potential complement: V + 得 + result (can) / V + 不 + result (cannot): 听不懂, 吃得完.","zh-Hans":"可能补语：动词＋得＋结果（能）/动词＋不＋结果（不能）：听不懂、吃得完。","zh-Hant":"可能補語：動詞＋得＋結果（能）/動詞＋不＋結果（不能）：聽不懂、喫得完。"},"3.de_degree":{"vi":"Bổ ngữ trình độ: V + 得 + đánh giá: 说得很流利, 来得真早.","en":"Degree complement: verb + 得 + evaluation: 说得很流利, 来得真早.","zh-Hans":"情态补语：动词＋得＋评价：说得很流利、来得真早。","zh-Hant":"情態補語：動詞＋得＋評價：說得很流利、來得真早。"},"3.yinwei":{"vi":"「因为…，所以…」 = vì… nên…","en":"因为…，所以… = because…, (so)…","zh-Hans":"「因为……，所以……」表示因果关系。","zh-Hant":"「因爲……，所以……」表示因果關係。"},"3.suiran":{"vi":"「虽然…，但是…」 = tuy… nhưng…","en":"虽然…，但是… = although…, (but)…","zh-Hans":"「虽然……，但是……」表示转折关系。","zh-Hant":"「雖然……，但是……」表示轉折關係。"},"3.ruguo":{"vi":"「如果…，就…」 = nếu… thì…","en":"如果…，就… = if…, then…","zh-Hans":"「如果……，就……」表示假设关系。","zh-Hant":"「如果……，就……」表示假設關係。"},"3.yijiu":{"vi":"「一…就…」 = vừa… là… (hai hành động nối tiếp ngay): 一回到家就做作业.","en":"一…就… = as soon as…: 一回到家就做作业.","zh-Hans":"「一……就……」表示两个动作紧接着发生。","zh-Hant":"「一……就……」表示兩個動作緊接着發生。"},"3.budan":{"vi":"「不但…，而且…」 = không những… mà còn…","en":"不但…，而且… = not only… but also…","zh-Hans":"「不但……，而且……」表示递进关系。","zh-Hant":"「不但……，而且……」表示遞進關係。"},"3.dur_le":{"vi":"「V + 了 + thời lượng + (O) + 了」: hành động kéo dài đến hiện tại và còn tiếp tục: 学了两年汉语了.","en":"V + 了 + duration + (object) + 了: an action that has lasted up to now and continues: 学了两年汉语了.","zh-Hans":"「动词＋了＋时量＋（宾语）＋了」表示动作持续到现在，还可能继续：学了两年汉语了。","zh-Hant":"「動詞＋了＋時量＋（賓語）＋了」表示動作持續到現在，還可能繼續：學了兩年漢語了。"},"3.nian":{"vi":"「年」 (cũng như 天) đi thẳng sau số, không cần lượng từ: 三年 (không nói 三个年).","en":"年 (like 天) follows the number directly with no measure word: 三年, not 三个年.","zh-Hans":"「年」「天」前直接用数词，不加量词：三年，不说「三个年」。","zh-Hant":"「年」「天」前直接用數詞，不加量詞：三年，不說「三個年」。"},"3.shide":{"vi":"「是…的」 nhấn mạnh thời gian, nơi chốn, cách thức của việc đã xảy ra: 我是坐飞机来的. Không dùng 了 thay cho 的.","en":"是…的 emphasizes the time, place or manner of a past event: 我是坐飞机来的. 了 can't replace 的.","zh-Hans":"「是……的」强调已发生动作的时间、地点、方式：我是坐飞机来的，句尾不能换成「了」。","zh-Hant":"「是……的」強調已發生動作的時間、地點、方式：我是坐飛機來的，句尾不能換成「了」。"},"3.yuelaiyue":{"vi":"「越来越 + tính từ」 = ngày càng…, không thêm 很/最 trước tính từ.","en":"越来越 + adjective = more and more…; no 很/最 before the adjective.","zh-Hans":"「越来越＋形容词」表示程度随时间加深，形容词前不能加「很、最」。","zh-Hant":"「越來越＋形容詞」表示程度隨時間加深，形容詞前不能加「很、最」。"},"4.lian":{"vi":"「连…都/也…」 = ngay cả… cũng…, nhấn mạnh trường hợp cực đoan.","en":"连…都/也… = even…, stressing an extreme case.","zh-Hans":"「连……都/也……」强调极端的情况，表示“甚至”。","zh-Hant":"「連……都/也……」強調極端的情況，表示“甚至”。"},"4.chule_hai":{"vi":"「除了…以外，还…」 = ngoài… ra còn… (bao gồm cả cái đã nêu).","en":"除了…以外，还… = besides…, also… (inclusive).","zh-Hans":"「除了……以外，还……」表示在所说的之外还有补充（包括在内）。","zh-Hant":"「除了……以外，還……」表示在所說的之外還有補充（包括在內）。"},"4.chule_dou":{"vi":"「除了…以外，都…」 = trừ… ra, tất cả đều… (loại trừ cái đã nêu).","en":"除了…以外，都… = except…, all… (exclusive).","zh-Hans":"「除了……以外，都……」表示排除所说的，其余都一样。","zh-Hant":"「除了……以外，都……」表示排除所說的，其餘都一樣。"},"4.zhiyao":{"vi":"「只要…就…」 = chỉ cần… là… (điều kiện đủ).","en":"只要…就… = as long as…, (then)… (sufficient condition).","zh-Hans":"「只要……就……」表示充分条件。","zh-Hant":"「只要……就……」表示充分條件。"},"4.zhiyou":{"vi":"「只有…才…」 = chỉ có… mới… (điều kiện bắt buộc).","en":"只有…才… = only if…, (then)… (necessary condition).","zh-Hans":"「只有……才……」表示唯一条件、必要条件。","zh-Hant":"「只有……才……」表示唯一條件、必要條件。"},"4.buguan":{"vi":"「不管…都…」 = bất kể… đều…; sau 不管 thường có từ để hỏi hoặc lựa chọn (怎么样).","en":"不管…都… = no matter…; 不管 is followed by a question word or alternatives (怎么样).","zh-Hans":"「不管……都……」表示在任何条件下结果都不变，「不管」后常有疑问代词或选择形式。","zh-Hant":"「不管……都……」表示在任何條件下結果都不變，「不管」後常有疑問代詞或選擇形式。"},"4.jishi":{"vi":"「即使…也…」 = cho dù… cũng… (giả thiết nhượng bộ).","en":"即使…也… = even if…, still… (hypothetical concession).","zh-Hans":"「即使……也……」表示假设的让步。","zh-Hant":"「即使……也……」表示假設的讓步。"},"4.yueyue":{"vi":"「越 A 越 B」 = càng A càng B; không dùng 很/最/太 trước B.","en":"越A越B = the more A, the more B; no 很/最/太 before B.","zh-Hans":"「越A越B」表示B随A的变化而变化，B前不能加「很、最、太」。","zh-Hant":"「越A越B」表示B隨A的變化而變化，B前不能加「很、最、太」。"},"4.cai":{"vi":"「才」 sau thời gian: muộn hơn dự kiến (7 giờ bắt đầu, 7 rưỡi mới đến).","en":"才 after a time = later than expected (it starts at 7, he only arrives at 7:30).","zh-Hans":"时间词后用「才」表示说话人认为时间晚。","zh-Hant":"時間詞後用「才」表示說話人認爲時間晚。"},"4.jiu":{"vi":"「就…了」 sau thời gian: sớm hơn dự kiến: 六点就起床了.","en":"就…了 after a time = earlier than expected: 六点就起床了.","zh-Hans":"时间词后用「就……了」表示说话人认为时间早：六点就起床了。","zh-Hant":"時間詞後用「就……了」表示說話人認爲時間早：六點就起牀了。"},"4.you":{"vi":"「又」 = lại (sự lặp lại đã xảy ra): 今天又迟到了.","en":"又 = again, for a repetition that has already happened: 今天又迟到了.","zh-Hans":"「又」表示已经发生的重复：今天又迟到了。","zh-Hant":"「又」表示已經發生的重複：今天又遲到了。"},"4.zai2":{"vi":"「再」 = lại, nữa (sự lặp lại chưa xảy ra, trong tương lai / lời đề nghị): 请再说一遍.","en":"再 = again, for a repetition that hasn't happened yet (future, requests): 请再说一遍.","zh-Hans":"「再」表示尚未发生的重复：请再说一遍。","zh-Hant":"「再」表示尚未發生的重複：請再說一遍。"},"4.qilai":{"vi":"「V + 起来」 có thể diễn tả đánh giá, cảm nhận: 看起来 = trông có vẻ.","en":"V + 起来 can express an impression: 看起来 = looks / seems.","zh-Hans":"「动词＋起来」可表示估计或评价：看起来很便宜。","zh-Hant":"「動詞＋起來」可表示估計或評價：看起來很便宜。"},"4.de_de":{"vi":"「得」 đứng sau động từ/tính từ để nối bổ ngữ: 高兴得跳了起来.","en":"得 follows a verb/adjective to introduce a complement: 高兴得跳了起来.","zh-Hans":"「得」用在动词、形容词后，连接补语：高兴得跳了起来。","zh-Hant":"「得」用在動詞、形容詞後，連接補語：高興得跳了起來。"},"4.de_di":{"vi":"「地」 đứng trước động từ, nối trạng ngữ: 认真地回答.","en":"地 links an adverbial to the following verb: 认真地回答.","zh-Hans":"「地」用在状语和动词之间：认真地回答。","zh-Hant":"「地」用在狀語和動詞之間：認真地回答。"},"4.de_de1":{"vi":"「的」 đứng trước danh từ, nối định ngữ: 新买的手机.","en":"的 links an attribute to the following noun: 新买的手机.","zh-Hans":"「的」用在定语和名词之间：新买的手机。","zh-Hant":"「的」用在定語和名詞之間：新買的手機。"},"4.yibian":{"vi":"「一边…一边…」 = vừa… vừa… (hai hành động cùng lúc).","en":"一边…一边… = doing two things at the same time.","zh-Hans":"「一边……一边……」表示两个动作同时进行。","zh-Hant":"「一邊……一邊……」表示兩個動作同時進行。"},"4.dui_laishuo":{"vi":"「对…来说」 = đối với… mà nói (từ góc độ của ai).","en":"对…来说 = for… / as far as… is concerned.","zh-Hans":"「对……来说」表示从某人或某方面的角度看。","zh-Hant":"「對……來說」表示從某人或某方面的角度看。"},"4.guanyu":{"vi":"「关于」 giới thiệu chủ đề, có thể làm định ngữ: 关于…的书. 「对于」 không dùng như vậy.","en":"关于 introduces a topic and can form an attribute: 关于…的书 (a book about…). 对于 can't be used this way.","zh-Hans":"「关于」引出涉及的范围或内容，可组成定语：关于……的书；「对于」没有这种用法。","zh-Hant":"「關於」引出涉及的範圍或內容，可組成定語：關於……的書；「對於」沒有這種用法。"},"4.youyu":{"vi":"「由于」 = do, bởi vì (nêu nguyên nhân), hay dùng trong văn viết.","en":"由于 = due to / because of (cause), often written style.","zh-Hans":"「由于」表示原因，多用于书面语。","zh-Hant":"「由於」表示原因，多用於書面語。"},"4.bujin":{"vi":"「不仅…还/也/而且…」 = không chỉ… mà còn…","en":"不仅…还/也/而且… = not only… but also…","zh-Hans":"「不仅……还/也/而且……」表示递进。","zh-Hant":"「不僅……還/也/而且……」表示遞進。"},"4.ba_cheng":{"vi":"「把 A + V + 成 + B」 = biến A thành B: 翻译成中文.","en":"把 A + V + 成 + B = turn A into B: 翻译成中文 (translate into Chinese).","zh-Hans":"「把A＋动词＋成＋B」表示使A变为B：翻译成中文。","zh-Hant":"「把A＋動詞＋成＋B」表示使A變爲B：翻譯成中文。"},"4.jiran":{"vi":"「既然…就…」 = đã… thì… (dựa vào sự thật đã có để kết luận).","en":"既然…就… = since (given that)…, then…","zh-Hans":"「既然……就……」以已成事实为前提推出结论。","zh-Hant":"「既然……就……」以已成事實爲前提推出結論。"},"4.haishi":{"vi":"「还是」 dùng trong câu hỏi lựa chọn: A 还是 B？","en":"还是 is used in alternative questions: A 还是 B?","zh-Hans":"「还是」用于选择疑问句：A还是B？","zh-Hant":"「還是」用於選擇疑問句：A還是B？"},"4.huozhe":{"vi":"「或者」 = hoặc, dùng trong câu trần thuật.","en":"或者 = or, used in statements.","zh-Hans":"「或者」表示选择，用于陈述句。","zh-Hant":"「或者」表示選擇，用於陳述句。"},"4.bian":{"vi":"「遍」 là động lượng từ chỉ số lần làm trọn vẹn từ đầu đến cuối: 看了三遍.","en":"遍 is a verbal measure word for times done from start to finish: 看了三遍.","zh-Hans":"「遍」是动量词，表示从头到尾的整个过程：看了三遍。","zh-Hant":"「遍」是動量詞，表示從頭到尾的整個過程：看了三遍。"},"5.nandao":{"vi":"「难道…吗？」 là câu hỏi tu từ 'lẽ nào…', nhấn mạnh ý ngược lại.","en":"难道…吗？ is a rhetorical question: 'Surely you don't mean…?'","zh-Hans":"「难道……吗？」是反问句，加强语气。","zh-Hant":"「難道……嗎？」是反問句，加強語氣。"},"5.fouze":{"vi":"「否则」 = nếu không thì…, nêu hậu quả khi không làm điều phía trước.","en":"否则 = otherwise; gives the consequence if the preceding isn't done.","zh-Hans":"「否则」意思是“如果不这样”，引出相反的结果。","zh-Hant":"「否則」意思是“如果不這樣”，引出相反的結果。"},"5.yushi":{"vi":"「于是」 = thế là, hành động sau xảy ra tiếp theo do việc trước gây nên.","en":"于是 = so / thereupon: the next action follows from the previous one.","zh-Hans":"「于是」表示后一事紧接着前一事发生，并且由前一事引起。","zh-Hant":"「於是」表示後一事緊接着前一事發生，並且由前一事引起。"},"5.shenzhi":{"vi":"「甚至」 = thậm chí, nêu ví dụ nổi bật nhất.","en":"甚至 = even, introducing the most extreme example.","zh-Hans":"「甚至」提出突出的事例，表示更进一层。","zh-Hant":"「甚至」提出突出的事例，表示更進一層。"},"5.ningke":{"vi":"「宁可…也不…」 = thà… chứ không…","en":"宁可…也不… = would rather… than…","zh-Hans":"「宁可……也不……」表示比较利害后选择前者。","zh-Hant":"「寧可……也不……」表示比較利害後選擇前者。"},"5.yuqi":{"vi":"「与其…不如…」 = thay vì… chi bằng… (chọn vế sau).","en":"与其…不如… = rather than…, better to… (prefer the latter).","zh-Hans":"「与其……不如……」表示舍弃前者，选择后者。","zh-Hant":"「與其……不如……」表示捨棄前者，選擇後者。"},"5.jinguan":{"vi":"「尽管…还是…」 = mặc dù… vẫn… (với sự thật đã xảy ra). 「无论」 cần lựa chọn hoặc từ để hỏi, 「只要」 là điều kiện, 「与其」 là so sánh lựa chọn.","en":"尽管…还是… = although (a real fact)…, still…. 无论 needs alternatives or a question word, 只要 states a condition, 与其 compares choices.","zh-Hans":"「尽管……还是……」承认事实再转折；「无论」后要有疑问代词或选择成分，「只要」表示条件，「与其」用于取舍。","zh-Hant":"「儘管……還是……」承認事實再轉折；「無論」後要有疑問代詞或選擇成分，「只要」表示條件，「與其」用於取捨。"},"5.wulun":{"vi":"「无论 + từ để hỏi … 都…」 = bất kể… đều…","en":"无论 + question word … 都… = no matter…","zh-Hans":"「无论＋疑问代词……都……」表示任何条件下结果都不变。","zh-Hant":"「無論＋疑問代詞……都……」表示任何條件下結果都不變。"},"5.chufei":{"vi":"「除非…否则…」 = trừ phi…, nếu không thì…","en":"除非…否则… = unless…, otherwise…","zh-Hans":"「除非……否则……」表示唯一条件，不满足就会出现后面的结果。","zh-Hant":"「除非……否則……」表示唯一條件，不滿足就會出現後面的結果。"},"5.weile":{"vi":"「为了」 nêu mục đích; 「因为」 nêu nguyên nhân. Bảo vệ môi trường là mục đích → 为了.","en":"为了 states a purpose; 因为 states a cause. Protecting the environment is a purpose → 为了.","zh-Hans":"「为了」表示目的，「因为」表示原因。保护环境是目的，所以用「为了」。","zh-Hant":"「爲了」表示目的，「因爲」表示原因。保護環境是目的，所以用「爲了」。"},"5.yinci":{"vi":"「因此」 = do đó, nêu kết quả.","en":"因此 = therefore, introducing a result.","zh-Hans":"「因此」表示结果，意思是“因为这个”。","zh-Hant":"「因此」表示結果，意思是“因爲這個”。"},"5.faner":{"vi":"「不但不/没…，反而…」 = chẳng những không… mà ngược lại…","en":"不但不/没…，反而… = not only not…, but on the contrary…","zh-Hans":"「不但不/没……，反而……」表示结果与预期相反。","zh-Hant":"「不但不/沒……，反而……」表示結果與預期相反。"},"5.bijing":{"vi":"「毕竟」 = dù sao thì, nhấn mạnh một sự thật quan trọng.","en":"毕竟 = after all, stressing a key fact.","zh-Hans":"「毕竟」强调事实或原因，意思是“到底、终归”。","zh-Hant":"「畢竟」強調事實或原因，意思是“到底、終歸”。"},"5.hekuang":{"vi":"「…何况…呢？」 = huống chi…","en":"…何况…呢？ = let alone…","zh-Hans":"「……何况……呢？」用反问语气表示更进一层。","zh-Hant":"「……何況……呢？」用反問語氣表示更進一層。"},"5.yiwei":{"vi":"「以 A 为 B」 = lấy A làm B: 以质量为本.","en":"以A为B = take A as B: 以质量为本 (take quality as the foundation).","zh-Hans":"「以A为B」意思是“把A作为B”：以质量为本。","zh-Hant":"「以A爲B」意思是“把A作爲B”：以質量爲本。"},"5.zhiyu":{"vi":"「至于」 = còn về, chuyển sang một chủ đề liên quan.","en":"至于 = as for, shifting to a related topic.","zh-Hans":"「至于」引出另一个相关话题。","zh-Hant":"「至於」引出另一個相關話題。"},"5.yimian":{"vi":"「以免」 = để tránh (kết quả xấu).","en":"以免 = so as to avoid (a bad result).","zh-Hans":"「以免」表示避免发生某种不好的情况。","zh-Hant":"「以免」表示避免發生某種不好的情況。"},"6.jianyu":{"vi":"「鉴于」 = xét thấy, căn cứ vào tình hình (văn viết, thông báo).","en":"鉴于 = in view of, considering (formal notices).","zh-Hans":"「鉴于」表示以某种情况为依据，多用于公文书面语。","zh-Hant":"「鑑於」表示以某種情況爲依據，多用於公文書面語。"},"6.tangruo":{"vi":"「倘若…便/就…」 = nếu như (văn viết).","en":"倘若…便/就… = if (formal written style).","zh-Hans":"「倘若」意思是“如果”，书面语，常与「便、就」搭配。","zh-Hant":"「倘若」意思是“如果”，書面語，常與「便、就」搭配。"},"6.wubi":{"vi":"「务必」 = nhất định phải (yêu cầu, nhắc nhở).","en":"务必 = must / be sure to (a firm request).","zh-Hans":"「务必」表示必须、一定要，用于要求或提醒。","zh-Hant":"「務必」表示必須、一定要，用於要求或提醒。"},"6.hebi":{"vi":"「何必…呢？」 = cần gì phải…, câu hỏi tu từ.","en":"何必…呢？ = why bother…? (rhetorical)","zh-Hans":"「何必……呢」用反问语气表示不必。","zh-Hant":"「何必……呢」用反問語氣表示不必。"},"6.weibi":{"vi":"「未必」 = chưa chắc.","en":"未必 = not necessarily.","zh-Hans":"「未必」表示不一定。","zh-Hant":"「未必」表示不一定。"},"6.jiezhi":{"vi":"「截至 + thời điểm」 = tính đến (thời điểm đó); 「截止」 = hết hạn, thường đứng cuối hoặc + 到.","en":"截至 + time = up to (that time); 截止 means 'to close / end' and usually stands alone or takes 到.","zh-Hans":"「截至＋时间」表示到某时为止；「截止」表示到期停止，一般不直接带时间宾语。","zh-Hant":"「截至＋時間」表示到某時爲止；「截止」表示到期停止，一般不直接帶時間賓語。"},"6.yuyi":{"vi":"「予以 + động từ hai âm tiết」 = dành cho (văn viết): 予以奖励, 予以配合.","en":"予以 + disyllabic verb = give / grant (formal): 予以奖励, 予以配合.","zh-Hans":"「予以＋双音节动词」表示给予，书面语：予以奖励、予以配合。","zh-Hant":"「予以＋雙音節動詞」表示給予，書面語：予以獎勵、予以配合。"},"6.zhisuoyi":{"vi":"「之所以…是因为…」 = sở dĩ… là vì… (nêu kết quả trước, nguyên nhân sau).","en":"之所以…是因为… = the reason why… is that… (result first, cause after).","zh-Hans":"「之所以……是因为……」先说结果，再说原因。","zh-Hant":"「之所以……是因爲……」先說結果，再說原因。"},"6.feibuke":{"vi":"「非…不可」 = nhất định phải…","en":"非…不可 = must, have to (no alternative).","zh-Hans":"「非……不可」表示一定要、必须。","zh-Hant":"「非……不可」表示一定要、必須。"},"6.yidan":{"vi":"「一旦…就…」 = một khi… thì…","en":"一旦…就… = once…, then…","zh-Hans":"「一旦……就……」表示某种情况一出现就会产生结果。","zh-Hant":"「一旦……就……」表示某種情況一出現就會產生結果。"},"6.yizhiyu":{"vi":"「以至于」 = đến mức, nêu hệ quả do mức độ cao.","en":"以至于 = to the extent that, introducing a consequence.","zh-Hans":"「以至于」表示由于前述情况程度深而产生的结果。","zh-Hant":"「以至於」表示由於前述情況程度深而產生的結果。"},"6.nanmian":{"vi":"「难免」 = khó tránh khỏi.","en":"难免 = hard to avoid, inevitable.","zh-Hans":"「难免」表示不容易避免。","zh-Hant":"「難免」表示不容易避免。"},"6.shifou":{"vi":"「是否」 = có… hay không (dạng văn viết của 是不是).","en":"是否 = whether (formal equivalent of 是不是).","zh-Hans":"「是否」是书面语，相当于「是不是」。","zh-Hant":"「是否」是書面語，相當於「是不是」。"},"6.shangwei":{"vi":"「尚未」 = vẫn chưa (dạng văn viết của 还没).","en":"尚未 = not yet (formal for 还没).","zh-Hans":"「尚未」是书面语，相当于「还没有」。","zh-Hant":"「尚未」是書面語，相當於「還沒有」。"},"6.zongshang":{"vi":"「综上所述」 = tóm lại những điều đã nói (kết luận trong văn viết).","en":"综上所述 = to sum up (written conclusion).","zh-Hans":"「综上所述」用于总结上文，书面语。","zh-Hant":"「綜上所述」用於總結上文，書面語。"},"6.jiyou":{"vi":"「既…又…」 = vừa… vừa… (hai đặc điểm cùng tồn tại).","en":"既…又… = both… and…","zh-Hans":"「既……又……」表示同时具有两方面的情况。","zh-Hant":"「既……又……」表示同時具有兩方面的情況。"},"6.buyoude":{"vi":"「不由得」 = bất giác, không kìm được.","en":"不由得 = can't help (doing).","zh-Hans":"「不由得」表示控制不住、不禁。","zh-Hant":"「不由得」表示控制不住、不禁。"},"6.bujin6":{"vi":"「不仅…也/还/而且…」 = không chỉ… mà còn…","en":"不仅…也/还/而且… = not only… but also…","zh-Hans":"「不仅……也/还/而且……」表示递进。","zh-Hant":"「不僅……也/還/而且……」表示遞進。"},"6.jiang":{"vi":"「将」 (văn viết) = sẽ: 会议将于…举行.","en":"将 (formal) = will: 会议将于…举行.","zh-Hans":"「将」是书面语，表示将来，相当于「要、会」。","zh-Hant":"「將」是書面語，表示將來，相當於「要、會」。"},"6.cong_chufa":{"vi":"「从…出发」 = xuất phát từ…, lấy… làm điểm xuất phát.","en":"从…出发 = start from / proceed from…","zh-Hans":"「从……出发」表示以某方面为出发点。","zh-Hant":"「從……出發」表示以某方面爲出發點。"}};

      }).join('') + '</ul>' + micHtml(q);
    } else {
      choicesHtml = '<div class="choices' + (longChoices ? ' long' : '') + '">' + q.c.map(function (c, i) {
        var zhc = q.ct === 'zh', cls = 'choice' + (q.ct === 'py' ? ' pyc' : zhc ? ' zhc' : '');
        if (state.selected === i) cls += ' sel';
        if (state.checked && i === q.a) cls += ' right';
        if (state.checked && state.selected === i && i !== q.a) cls += ' wrong';
        var txt = zhc ? zhSpan(choiceText(q, c)) : esc(choiceText(q, c));
        return '<button class="' + cls + '" data-i="' + i + '"' + (state.checked ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + txt + '</button>';
      }).join('') + '</div>';
      if (q.s === 'S' && !state.checked) choicesHtml = '<p class="listen-hint" style="margin:0 0 8px">' + esc(sr.kind ? t('mcqSpeakHint') : t('srUnavailable')) + '</p>' + choicesHtml;
    }
    var modeSw = q.s === 'S' && sr.kind ? '<div class="modesw"><span class="muted">' + esc(t('speakMode')) + '</span>' +
      '<button type="button" data-speak="mic" class="' + (mic ? 'on' : '') + '"' + (state.checked ? ' disabled' : '') + '>' + esc(t('speakModeMic')) + '</button>' +
      '<button type="button" data-speak="mcq" class="' + (!mic ? 'on' : '') + '"' + (state.checked ? ' disabled' : '') + '>' + esc(t('speakModeMcq')) + '</button></div>' : '';
    app.innerHTML =
      '<section class="card">' +
        '<div class="topbar"><span class="tag">' + esc(bookName(q.b)) + '</span><span class="tag sk">' + SKILL_ICON[q.s] + ' ' + esc(skillName(q.s)) + '</span><span class="tag type">' + esc(t('type.' + q.t)) + '</span>' +
          '<span class="spacer"></span>' +
          '<span>' + esc(t('score') + t('colon').replace(/\s+$/, '')) + ' <b>' + score + '</b></span>' +
          '<span>' + esc(t('streak') + t('colon').replace(/\s+$/, '')) + ' <b>' + state.streak + '</b></span></div>' +
        '<div class="progress"><div style="width:' + (100 * state.answers.length / n) + '%"></div></div>' +
        '<p class="muted">' + esc(t('questionOf', { i: state.idx + 1, n: n })) + '</p>' + modeSw +
        '<p id="tts-warn" class="tts-warn"' + (w ? '' : ' style="display:none"') + '>' + esc(w) + '</p>' +
        '<p class="stem">' + esc(stemOf(q)) + '</p>' +
        '<div class="zhbox">' + zhBoxHtml(q) + '</div>' +
        choicesHtml +
        '<p id="warn" class="warn" aria-live="polite"></p>' + fb +
        '<div class="actions"><button id="quit" class="ghost">' + esc(t('quitSave')) + '</button>' +
          (state.checked ? '<button id="next" class="primary">' + esc(last ? t('seeResults') : t('next')) + '</button>'
                         : '<button id="check" class="primary">' + esc(t('check')) + '</button>') + '</div>' +
      '</section>';
    app.querySelectorAll('.choice').forEach(function (b) { b.onclick = function () { if (!state.checked) { state.selected = +b.dataset.i; render(true); } }; });
    app.querySelectorAll('[data-speak]').forEach(function (b) { b.onclick = function () { state.speak = b.dataset.speak; state.speech = null; state.srMsg = ''; savePrefs(); render(true); }; });
    if ($('spk')) $('spk').onclick = function () { speakCurrent(0.9); };
    if ($('spk-slow')) $('spk-slow').onclick = function () { speakCurrent(0.6); };
    if ($('spk-full')) $('spk-full').onclick = function () { speak(q.sp2 || (q.s === 'S' && !q.sayc ? q.say : q.sp), 0.85); };
    if ($('showpy')) $('showpy').onclick = function () { state.showPy = true; render(true); };
    if ($('mic')) $('mic').onclick = doMic;
    $('quit').onclick = function () { if (confirm(t('confirmQuit'))) { stopSpeak(); saveSession(); state.screen = 'home'; render(); } };
    if ($('check')) $('check').onclick = check;
    if ($('next')) { $('next').onclick = next; $('next').focus(); }
    if (q.h && !state.checked && state.spokenFor !== q.id) {
      state.spokenFor = q.id;
      if (!isIOS) setTimeout(function () { speakCurrent(0.85); }, 250);
    }
  }
  function doMic() {
    var q = state.quiz[state.idx]; if (state.checked) return;
    state.srMsg = '';
    listen(function (err, alts) {
      if (state.quiz[state.idx] !== q || state.screen !== 'quiz') return;
      if (err) {
        if (err === 'not-allowed' || err === 'service-not-allowed' || /permission|denied/i.test(err)) { state.srMsg = t('srDenied'); }
        else if (err === 'no-speech' || err === 'no-match' || /match|speech/i.test(err)) state.srMsg = t('srNoMatch');
        else if (err === 'unsupported') { sr.kind = null; state.srMsg = t('srUnavailable'); }
        else state.srMsg = t('srError', { e: err });
        render(true); return;
      }
      var g = gradeSpeech(q, alts);
      if (!state.speech || g.ok || g.sim >= state.speech.sim) state.speech = g;
      render(true);
    });
  }
  function check() {
    var q = state.quiz[state.idx], rec;
    if (useMic(q)) {
      if (!state.speech) { $('warn').textContent = t('noAttempt'); return; }
      var sp = state.speech;
      rec = { id: q.id, chosen: sp.ok ? q.a : (q.sayc ? sp.idx : -1), ok: !!sp.ok, said: sp.said, pct: sp.pct };
    } else {
      if (state.selected === null) { $('warn').textContent = t('chooseAnswer'); return; }
      rec = { id: q.id, chosen: state.selected, ok: state.selected === q.a };
    }
    state.answers.push(rec);
    state.streak = rec.ok ? state.streak + 1 : 0; state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.checked = true; saveSession(); render(true);
  }
  function next() {
    stopSpeak();
    if (state.idx < state.quiz.length - 1) { state.idx++; resetQ(); saveSession(); render(); return; }
    state.elapsed += Date.now() - state.resumedAt;
    var c = scoreOf(state.answers), n = state.quiz.length, bk = bestKey(state.book, state.skill, state.mode), best = getJSON(bk);
    if (!best || c > best.c) { store.set(bk, JSON.stringify({ c: c, n: n, at: Date.now() })); state.newBest = true; }
    store.del(LS_SESSION);
    state.screen = 'results'; render();
  }

  /* ---------------- RESULTS ---------------- */
  function renderResults() {
    var n = state.quiz.length, c = scoreOf(state.answers), pct = Math.round(100 * c / n);
    var msg = pct >= 90 ? 'msg.excellent' : pct >= 60 ? 'msg.good' : 'msg.keep';
    var byType = {}, order = [];
    state.quiz.forEach(function (q, i) {
      if (!byType[q.t]) { byType[q.t] = { n: 0, c: 0 }; order.push(q.t); }
      byType[q.t].n++; if (state.answers[i] && state.answers[i].ok) byType[q.t].c++;
    });
    app.innerHTML =
      '<section class="card center">' +
        '<h1>' + esc(t('resultsTitle')) + '</h1>' +
        '<p class="muted">' + esc(bookName(state.book)) + ' · ' + SKILL_ICON[state.skill] + ' ' + esc(skillName(state.skill)) + ' · ' + esc(modeName(state.mode)) + '</p>' +
        '<div class="ring" style="--p:' + pct + '"><span>' + pct + '%</span></div>' +
        '<p class="big-text">' + esc(t('youScored', { c: c, n: n })) + '</p>' +
        (state.newBest ? '<p class="badge">🏆 ' + esc(t('newBest')) + '</p>' : '') +
        '<p>' + esc(t(msg)) + '</p><p class="muted">' + esc(t('timeTaken', { t: fmtTime(state.elapsed) })) + ' · ' + esc(t('streak') + t('colon').replace(/\s+$/, '')) + ' ' + state.bestStreak + '</p>' +
        '<p class="muted" style="margin-bottom:0">' + esc(t('byType')) + '</p><div class="types">' +
          order.map(function (k) { return '<span>' + esc(t('type.' + k)) + ' ' + byType[k].c + '/' + byType[k].n + '</span>'; }).join('') + '</div>' +
        '<div class="actions centered"><button id="home" class="ghost">' + esc(t('home')) + '</button><button id="again" class="primary">' + esc(t('playAgain')) + '</button></div>' +
      '</section>' +
      '<section class="card"><h2>' + esc(t('review')) + '</h2><ol class="review">' +
        state.quiz.map(function (q, i) {
          var an = state.answers[i] || { chosen: -1, ok: false };
          var mine = an.said !== undefined ? t('yourSpeech', { t: an.said || '…', p: an.pct || 0 }) : t('yourAnswer', { ans: choiceText(q, q.c[an.chosen]) });
          return '<li class="' + (an.ok ? 'ok' : 'bad') + '"><p class="stem-sm"><span class="tag type">' + esc(t('type.' + q.t)) + '</span> ' + zhSpan(shortZh(q)) + '</p>' +
            '<p class="res">' + (an.ok ? '✔ ' : '✘ ') + esc(mine) +
            (an.ok ? '' : ' · ' + esc(t('correctAnswerIs', { ans: answerText(q) }))) + '</p>' +
            '<p class="expl">' + esc(explain(q)) + '</p></li>';
        }).join('') + '</ol></section>';
    $('home').onclick = function () { state.screen = 'home'; render(); };
    $('again').onclick = startQuiz;
  }

  function render(keepScroll) {
    if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'results') renderResults();
    else renderHome();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  document.addEventListener('keydown', function (e) {
    if (state.screen !== 'quiz' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var q = state.quiz[state.idx];
    if (!state.checked && !useMic(q) && /^[1-4]$/.test(e.key) && q.c[+e.key - 1] !== undefined) { state.selected = +e.key - 1; render(true); }
    else if (e.key === 'Enter') { e.preventDefault(); state.checked ? next() : check(); }
    else if (e.key === 'l' || e.key === 'L') { speakCurrent(0.9); }
    else if ((e.key === 'm' || e.key === 'M') && useMic(q)) { doMic(); }
  });
  window.addEventListener('beforeunload', saveSession);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveSession(); });
  document.addEventListener('pause', saveSession, false);

  // Cordova (Android APK): native TTS + native speech recognition plugins
  document.addEventListener('deviceready', function () {
    isCordova = true;
    if (window.TTS && window.TTS.speak) tts.native = true;
    if (window.plugins && window.plugins.speechRecognition) {
      window.plugins.speechRecognition.isRecognitionAvailable(function (ok) { sr.kind = ok ? 'cordova' : (SRC ? 'web' : null); if (app) render(true); },
        function () { sr.kind = SRC ? 'web' : null; if (app) render(true); });
    }
    if (app) render(true);
  }, false);

  // test hooks
  window.__hn = { explain: explain, stemOf: stemOf, setLangRaw: function (c) { lang = c; }, similarity: similarity, numsToZh: numsToZh, intZh: intZh, gradeSpeech: gradeSpeech, state: state, sr: sr };

  document.addEventListener('DOMContentLoaded', function () {
    app = $('app');
    var sel = $('lang-select');
    sel.innerHTML = LANGS.map(function (l) { return '<option value="' + l.code + '" lang="' + l.code + '">' + l.label + '</option>'; }).join('');
    sel.onchange = function () { setLang(sel.value); };
    applyStatic(); render();
  });
})();

</script>
</body>
</html>
